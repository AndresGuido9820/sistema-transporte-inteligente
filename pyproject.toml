[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-transporte-inteligente"
version = "0.1.0"
description = "Sistema integrado de prediccion, clasificacion visual y recomendacion para transporte"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

