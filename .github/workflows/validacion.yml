name: Validacion

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            app
            data/processed/demand.csv
            data/processed/travel_interactions.csv
            data/processed/driver_images.csv
            docs
            notebooks
            outputs
            report
            scripts
            src
            tests
            requirements.txt
            pyproject.toml

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias de prueba
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scikit-learn streamlit joblib pillow matplotlib

      - name: Ejecutar pytest
        run: PYTHONPATH=src pytest -q
